version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: calyvia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: "${POSTGRES_DB:-calyvia_db}"
      TZ: Africa/Nairobi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-calyvia_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: calyvia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: calyvia_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: calyvia_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}"
      ENCRYPTION_MASTER_KEY: "${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY must be set}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      SMS_PROVIDER: "bytewave"
      WHATSAPP_PROVIDER: "baileys"
      MPESA_ENVIRONMENT: "${MPESA_ENVIRONMENT:-production}"
      MPESA_CONSUMER_KEY: "${MPESA_CONSUMER_KEY:-}"
      MPESA_CONSUMER_SECRET: "${MPESA_CONSUMER_SECRET:-}"
      MPESA_SHORTCODE: "${MPESA_SHORTCODE:-}"
      MPESA_PASSKEY: "${MPESA_PASSKEY:-}"
      MPESA_CALLBACK_URL: "${MPESA_CALLBACK_URL:-https://api.calyviawellness.co.ke/api/v1/integrations/mpesa/callback}"
      MPESA_TRANSACTION_TYPE: "${MPESA_TRANSACTION_TYPE:-CustomerPayBillOnline}"
      MPESA_CALLBACK_ALLOWED_IPS: "${MPESA_CALLBACK_ALLOWED_IPS:-}"
      TZ: Africa/Nairobi
    ports:
      - "4000:4000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: calyvia_admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://api.calyviawellness.co.ke/api/v1}"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
